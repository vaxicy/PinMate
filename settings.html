<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PinMate Settings</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="settings-page">
    <div class="settings-header">
      <img class="logo" src="assets/icons/icon48.png" alt="PinMate">
      <h1 data-i18n="settingsTitle">PinMate Settings</h1>
    </div>

    <div class="notice" id="notice"></div>

    <!-- Language -->
    <section class="section">
      <h2 data-i18n="language">Language</h2>
      <div class="field">
        <select class="select" id="langSelect">
          <option value="en">English</option>
          <option value="zh">中文</option>
        </select>
      </div>
    </section>

    <!-- AI Configuration -->
    <section class="section">
      <h2 data-i18n="aiConfiguration">AI Configuration</h2>

      <div class="field">
        <label data-i18n="apiProvider">API Provider</label>
        <select class="select" id="providerSelect">
          <option value="siliconflow" data-i18n="providerSiliconflow">SiliconFlow</option>
          <option value="openai" data-i18n="providerOpenai">OpenAI</option>
          <option value="custom" data-i18n="providerCustom">Custom / OpenAI Compatible</option>
        </select>
      </div>

      <div class="field" id="apiBaseField" style="display:none;">
        <label data-i18n="apiBaseUrl">API Base URL</label>
        <input class="input" id="apiBase" type="text" data-i18n-ph="apiBaseUrlPlaceholder"
               placeholder="https://your-endpoint/v1" autocomplete="off" />
        <div class="hint" data-i18n="apiBaseUrlHint">OpenAI-compatible endpoints usually end with /v1</div>
      </div>

      <div class="field">
        <label data-i18n="apiKey">API Key</label>
        <div class="key-row">
          <input class="input" id="apiKey" type="password" data-i18n-ph="apiKeyPlaceholder"
                 placeholder="Enter your API Key" autocomplete="off" />
          <button class="key-toggle" id="keyToggle" type="button">Show</button>
        </div>
      </div>

      <div class="field">
        <label data-i18n="model">Model</label>
        <input class="input" id="model" type="text" />
      </div>

      <div class="field">
        <label data-i18n="generationLanguage">Generation Language</label>
        <select class="select" id="generationLangSelect">
          <option value="en">English</option>
          <option value="zh">中文</option>
        </select>
      </div>

      <div class="row">
        <button class="btn btn-primary" id="btnSave" data-i18n="save">Save</button>
        <button class="btn btn-outline" id="btnTest" data-i18n="testConnection">Test Connection</button>
        <span class="status-pill off" id="connPill">
          <span class="status-dot"></span>
          <span id="connText" data-i18n="statusNotConnected">Not Connected</span>
        </span>
      </div>
    </section>
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/settings.js"></script>
</body>
</html>
